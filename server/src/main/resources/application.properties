# 1. Server Port (Replaces const PORT = 4000)
server.port=4000

# 2. MongoDB Connection (Replaces your config/config.js logic)
# Change "splitit" to whatever your database name actually is
spring.data.mongodb.uri=mongodb://localhost:27017/test

# 3. JWT Secret (Replaces process.env.JWT_SECRET_KEY)
# Note: For JJWT, this secret MUST be at least 32 characters long!
jwt.secret=my_super_secret_key_which_needs_to_be_long_enough_for_hmac_sha256
jwt.expiration=25892000000

# 4. File Upload Limits (Replaces some of Multer's background config)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB